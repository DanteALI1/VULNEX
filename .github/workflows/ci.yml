name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check vulndb config || true
      - name: Django check
        env:
          DEBUG: "1"
          SECRET_KEY: ci-secret
          DATABASE_URL: ""
        run: |
          python manage.py migrate --noinput
          python manage.py check
          python manage.py test vulndb.apps.tickets -v1
