<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Лицензия · Мастер NovaTIP</title>
  <link rel="stylesheet" href="css/tip-console.css" />
</head>
<body>
  <div class="wizard-shell">
    <header class="topbar" style="position:static">
      <div class="brand" style="border:0;padding:0;height:auto">
        <div class="brand-mark">NT</div>
        <div class="brand-text"><strong>NovaTIP</strong><span>Первичная настройка</span></div>
      </div>
      <div class="topbar-spacer"></div>
      <span style="font-size:12px;color:var(--text-3)">Шаг 1 из 9</span>
    </header>
    <div class="wizard-body">
      <div class="steps-scroll">
        <div class="step is-active"><span>01</span><b>Лицензия</b></div>
        <div class="step"><span>02</span><b>Организация</b></div>
        <div class="step"><span>03</span><b>Оформление</b></div>
        <div class="step"><span>04</span><b>База данных</b></div>
        <div class="step"><span>05</span><b>Администратор</b></div>
        <div class="step"><span>06</span><b>Источники</b></div>
        <div class="step"><span>07</span><b>Почта</b></div>
        <div class="step"><span>08</span><b>Telegram</b></div>
        <div class="step"><span>09</span><b>Финиш</b></div>
      </div>
      <div class="panel">
        <div class="panel-h"><h2>Активация лицензии</h2><span class="sub">online + offline .novalic</span></div>
        <div class="panel-b stack">
          <div class="grid-2">
            <div class="field">
              <label>URL License Server</label>
              <input class="input" value="https://license.novatip.vendor.example/api/v1" />
            </div>
            <div class="field">
              <label>Hardware fingerprint</label>
              <input class="input" readonly value="a3f8c2e1…9b04" style="font-family:var(--mono);font-size:12px" />
            </div>
          </div>
          <div class="field">
            <label>Файл .novalic</label>
            <div class="row"><input class="input grow" readonly placeholder="не выбран" /><button class="btn" type="button">Выбрать</button></div>
          </div>
          <div class="alert ok">Проверка: <b>valid</b> · Enterprise · seats 50</div>
          <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
            <a class="btn" href="index.html">К шаблонам</a>
            <a class="btn btn-primary" href="setup.html">Далее → Организация</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
