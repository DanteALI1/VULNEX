{% extends "core/setup/base_wizard.html" %}
{% block wizard_content %}
<form method="post" class="panel">
  {% csrf_token %}
  <div class="panel-h"><h2>Telegram</h2><span class="sub">опционально</span></div>
  <div class="panel-b stack">
    <div class="field"><label>Bot token</label><input class="input" name="telegram_bot_token" value="{{ settings_obj.telegram_bot_token }}" /></div>
    <div class="field"><label>Chat ID</label><input class="input" name="telegram_chat_id" value="{{ settings_obj.telegram_chat_id }}" /></div>
  </div>
  <div class="panel-b row" style="justify-content:flex-end;gap:8px;border-top:1px solid var(--border)">
    <button class="btn" type="submit" name="action" value="back">Назад</button>
    <button class="btn" type="submit" name="skip_telegram" value="1">Пропустить</button>
    <button class="btn btn-primary" type="submit" name="action" value="next">Продолжить</button>
  </div>
</form>
{% endblock %}
