{% extends "core/setup/base_wizard.html" %}
{% block wizard_content %}
<form method="post" class="panel">
  {% csrf_token %}
  <div class="panel-h"><h2>Администратор приложения</h2><span class="sub">Учётка веб-интерфейса VULNDB</span></div>
  <div class="panel-b stack">
    <div class="alert info">Это не пользователь PostgreSQL. Логин для входа в веб-консоль.</div>
    <div class="grid-2">
      <div class="field"><label>Логин</label><input class="input" name="username" required autocomplete="off" /></div>
      <div class="field"><label>ФИО</label><input class="input" name="full_name" /></div>
      <div class="field"><label>Email</label><input class="input" type="email" name="email" /></div>
      <div class="field"><label>Пароль</label><input class="input" type="password" name="password" required autocomplete="new-password" /></div>
      <div class="field"><label>Повтор пароля</label><input class="input" type="password" name="password2" required /></div>
    </div>
  </div>
  <div class="panel-b row" style="justify-content:flex-end;gap:8px;border-top:1px solid var(--border)">
    <button class="btn" type="submit" name="action" value="back">Назад</button>
    <button class="btn btn-primary" type="submit" name="action" value="next">Продолжить</button>
  </div>
</form>
{% endblock %}
